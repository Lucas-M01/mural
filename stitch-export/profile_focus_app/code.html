<body class="font-body-md text-body-md antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl flex justify-between items-center px-container-margin h-16 w-full flat no shadows">
<div class="flex items-center gap-4">
<button class="transition-all duration-200 active:scale-95 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<span class="font-h1 text-h1 tracking-tight text-on-surface">Focus</span>
</div>
<div class="flex items-center gap-4">
<button class="transition-all duration-200 active:scale-95 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</button>
</div>
</header>
<main class="pt-24 pb-32 px-container-margin space-y-stack-gap">
<!-- Profile Hero Section -->
<section class="flex flex-col items-center py-section-padding space-y-4">
<div class="relative w-24 h-24 rounded-full border-2 border-primary p-1">

<div class="absolute bottom-0 right-0 w-6 h-6 bg-primary rounded-full border-2 border-background flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-on-primary font-bold">check</span>
</div>
</div>
<div class="text-center">
<h2 class="font-h1 text-h1 text-on-surface">Julian Thorne</h2>
<p class="font-body-md text-on-surface-variant">julian.thorne@focus.ai</p>
</div>
</section>
<!-- Productivity Stats - Bento Grid Pattern -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
<!-- Weekly Activity Graph -->
<div class="col-span-1 md:col-span-2 bg-surface-container border border-outline-variant rounded-xl p-section-padding">
<div class="flex justify-between items-end mb-6">
<div>
<h3 class="font-h2 text-h2 text-on-surface">Weekly Productivity</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">7.4 Hours Avg. Daily Focus</p>
</div>
<div class="text-right">
<span class="text-primary font-bold text-h1">+12%</span>
</div>
</div>
<!-- Simplified Bar Chart -->
<div class="flex items-end justify-between h-32 gap-2">
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-secondary-container/40 rounded-t-sm h-[40%] hover:bg-primary transition-all duration-300"></div>
<span class="mt-2 font-label-sm text-label-sm text-on-surface-variant">M</span>
</div>
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-secondary-container/40 rounded-t-sm h-[75%] hover:bg-primary transition-all duration-300"></div>
<span class="mt-2 font-label-sm text-label-sm text-on-surface-variant">T</span>
</div>
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-secondary-container/40 rounded-t-sm h-[60%] hover:bg-primary transition-all duration-300"></div>
<span class="mt-2 font-label-sm text-label-sm text-on-surface-variant">W</span>
</div>
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-primary rounded-t-sm h-[95%] shadow-[0_0_15px_rgba(192,193,255,0.3)]"></div>
<span class="mt-2 font-label-sm text-label-sm text-primary font-bold">T</span>
</div>
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-secondary-container/40 rounded-t-sm h-[50%] hover:bg-primary transition-all duration-300"></div>
<span class="mt-2 font-label-sm text-label-sm text-on-surface-variant">F</span>
</div>
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-secondary-container/40 rounded-t-sm h-[20%] hover:bg-primary transition-all duration-300"></div>
<span class="mt-2 font-label-sm text-label-sm text-on-surface-variant">S</span>
</div>
<div class="flex flex-col items-center flex-1">
<div class="w-full bg-secondary-container/40 rounded-t-sm h-[30%] hover:bg-primary transition-all duration-300"></div>
<span class="mt-2 font-label-sm text-label-sm text-on-surface-variant">S</span>
</div>
</div>
</div>
<!-- Badges Section -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-section-padding flex flex-col justify-between">
<div>

<div class="grid grid-cols-2 gap-3">
<div class="flex flex-col items-center p-3 bg-surface-variant/50 rounded-lg border border-outline-variant">
<span class="material-symbols-outlined text-tertiary text-3xl mb-1" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
<span class="font-label-sm text-label-sm text-center">Focus Master</span>
</div>
<div class="flex flex-col items-center p-3 bg-surface-variant/50 rounded-lg border border-outline-variant">
<span class="material-symbols-outlined text-primary text-3xl mb-1" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-sm text-label-sm text-center">Streak Pro</span>
</div>
</div>
</div>
<button class="mt-6 font-label-sm text-primary hover:underline text-left">View all 12 badges</button>
</div>
<!-- Focus Stats Micro-Card -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-section-padding">
<h3 class="font-h2 text-h2 text-on-surface mb-2">Deep Work</h3>
<p class="font-body-md text-on-surface-variant mb-6">Total deep work hours this month</p>
<div class="flex items-center gap-4">
<div class="w-16 h-16 rounded-full border-4 border-primary border-t-outline-variant flex items-center justify-center">
<span class="font-bold text-primary">128h</span>
</div>
<div class="flex-1">
<div class="h-1 w-full bg-outline-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-3/4"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1 block">Goal: 160h</span>
</div>
</div>
</div>
</section>

<div class="bg-surface-container border border-outline-variant rounded-xl overflow-hidden">

<div class="flex items-center justify-between p-4 border-b border-outline-variant hover:bg-surface-variant/30 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">dark_mode</span>
<span class="font-body-md text-on-surface">Appearance</span>
</div>
<div class="flex items-center bg-surface-container-low rounded-full p-1 border border-outline-variant">
<button class="px-3 py-1 rounded-full text-label-sm bg-primary text-on-primary">Dark</button>
<button class="px-3 py-1 rounded-full text-label-sm text-on-surface-variant">Light</button>
</div>
</div>
<!-- Privacy -->
<button class="w-full flex items-center justify-between p-4 border-b border-outline-variant hover:bg-surface-variant/30 transition-colors text-left">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">security</span>
<span class="font-body-md text-on-surface">Data &amp; Privacy</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Notifications -->
<button class="w-full flex items-center justify-between p-4 border-b border-outline-variant hover:bg-surface-variant/30 transition-colors text-left">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">notifications_active</span>
<span class="font-body-md text-on-surface">Notification Center</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</button>
<!-- Logout -->
<button class="w-full flex items-center gap-3 p-4 hover:bg-error-container/20 transition-colors text-left">
<span class="material-symbols-outlined text-error">logout</span>
<span class="font-body-md text-error">Logout</span>
</button>
</div>
</section>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface-container/80 backdrop-blur-xl shadow-lg rounded-t-xl">

</button>

<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors transition-transform duration-200 active:scale-90">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
